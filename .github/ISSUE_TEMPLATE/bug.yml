name: バグ報告
description: 期待と異なる動作の報告
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているかを1〜3行で。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージやログがあれば貼る。
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 該当箇所
      description: ファイル・関数・ブランチ・コミットなど。
  - type: input
    id: review
    attributes:
      label: 関連レビュー
      description: docs/review 配下のファイルパス(あれば)。
