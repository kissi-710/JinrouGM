name: 機能・タスク
description: 新機能、改善、リファクタなど
labels: ["enhancement"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的・背景
      description: なぜ必要か。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 内容
      description: 何をするか。やらないことも書くと範囲が明確になる。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      placeholder: |
        - [ ]
        - [ ] テストが通る
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 関連箇所
      description: ファイル・設計書(docs/design.md の節など)。
  - type: input
    id: review
    attributes:
      label: 関連レビュー
      description: docs/review 配下のファイルパス(あれば)。
